<div>
    <h5 class="mb-3">Bill Summary</h5>
    <div>Total Amount: Rs. {{ totalAmount.toFixed(2) }}</div>
    <div id="bill-breakdown" class="mt-3">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Total Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td>{{ item.name }}</td>
            <td>Rs. {{ (item.quantity * item.price).toFixed(2) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
